[package]
name = "takt-compiler"
description = "Compilateur Structured Text (IEC 61131-3) de Takt, avec preuve du temps de cycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "taktc"
path = "src/bin/taktc.rs"

[dependencies]
takt-vm.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
