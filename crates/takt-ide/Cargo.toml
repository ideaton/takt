[package]
name = "takt-ide"
description = "Takt Studio : IDE façon TIA Portal pour automates RP2350 déterministes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "takt-studio"
path = "src/main.rs"

[dependencies]
takt-vm.workspace = true
takt-compiler.workspace = true
eframe = "0.31"
rfd = "0.15"
serialport = "4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
semver = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
